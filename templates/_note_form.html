<form method="post" action="{{ action }}" id="noteForm" novalidate
      {% if autosave_url %}data-autosave-url="{{ autosave_url }}"{% endif %}
      {% if draft_key %}data-draft-key="{{ draft_key }}"{% endif %}>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="ms-editor">
    <div class="mb-3">
      <label for="noteTitle" class="visually-hidden">Judul</label>
      <input type="text" id="noteTitle" name="title" maxlength="255" required autofocus
             class="ms-title-input {{ 'is-invalid' if errors.title }}" placeholder="Judul catatan"
             value="{{ form.title or '' }}">
      <div class="ms-field-error" id="titleError">{{ errors.title or '' }}</div>
    </div>

    <div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
      <label for="noteCategory" class="small text-muted mb-0"><i data-lucide="tag"></i> Kategori</label>
      <select name="category_id" id="noteCategory" class="form-select ms-select w-auto {{ 'is-invalid' if errors.category_id }}">
        <option value="">Tanpa kategori</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {{ 'selected' if form.category_id == c.id }}>{{ c.name }}</option>
        {% endfor %}
      </select>
      <div class="ms-field-error w-100">{{ errors.category_id or '' }}</div>
    </div>

    <label for="noteContent" class="visually-hidden">Isi catatan</label>
    <textarea id="noteContent" name="content" rows="16" class="ms-textarea {{ 'is-invalid' if errors.content }}"
              placeholder="Mulai menulis di sini…">{{ form.content or '' }}</textarea>
    <div class="ms-field-error">{{ errors.content or '' }}</div>

    <div class="ms-editor-foot">
      <span class="ms-save-status" id="saveStatus" aria-live="polite">
        {% if autosave_url %}<i data-lucide="cloud"></i> Autosave aktif{% endif %}
      </span>
      <span class="text-muted small"><span id="charCount">0</span> karakter</span>
    </div>
  </div>

  <div class="d-flex gap-2 justify-content-end mt-3">
    <a href="{{ cancel_url }}" class="btn btn-ms-ghost" id="cancelBtn">Batal</a>
    <button type="submit" class="btn btn-ms" id="saveBtn"><i data-lucide="check"></i> {{ submit_label }}</button>
  </div>
</form>
